<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户设置 - 雨天信箱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans+Pinstripe&family=Albert+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📮</text></svg>">
    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body class="sunny-mode">
    <div id="weather-background"></div>

    <!-- 用户信息栏 -->
    <div class="user-bar" id="user-bar">
        <div class="user-info">
            <span class="user-greeting">你好，<span id="user-name">用户</span></span>
        </div>
        <div class="user-actions">
            <a href="/" class="user-link">首页</a>
            <a href="/user/inbox" class="user-link">收件箱</a>
            <button id="logout-btn" class="text-btn">登出</button>
        </div>
    </div>

    <div class="container glass-effect fade-in">
        <header>
            <div class="brand-lockup">
                <span class="ks-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none">
                        <rect x="3" y="3" width="26" height="26" fill="currentColor"/>
                        <path d="M5 5 L27 27" stroke="oklch(7% 0.006 95)" stroke-width="2.5"/>
                    </svg>
                </span>
                <span class="ks-wordmark">RainMail</span>
            </div>
            <h1>账户设置</h1>
            <p>管理你的账户信息</p>
        </header>

        <div class="settings-container">
            <!-- 用户信息卡片 -->
            <div class="settings-card">
                <h2>基本信息</h2>
                <form id="profile-form" class="settings-form">
                    <div class="form-group">
                        <label for="email">邮箱地址</label>
                        <input type="email" id="email" readonly class="readonly-field">
                        <small>邮箱地址不可修改</small>
                    </div>
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" maxlength="50" placeholder="输入你的用户名">
                        <small>用户名将显示在收件箱和信件中</small>
                    </div>
                    <div class="form-group">
                        <label>注册时间</label>
                        <div id="created-at" class="info-field">-</div>
                    </div>
                    <div class="form-group">
                        <label>邮箱验证状态</label>
                        <div id="verified-status" class="info-field">-</div>
                    </div>
                    <button type="submit" class="primary-btn">保存修改</button>
                </form>
            </div>

            <!-- 操作卡片 -->
            <div class="settings-card">
                <h2>快捷操作</h2>
                <div class="action-links">
                    <a href="/" class="action-link">返回首页</a>
                    <a href="/user/inbox" class="action-link">查看收件箱</a>
                </div>
            </div>
        </div>

        <!-- 消息提示 -->
        <div id="message-toast" class="message-toast" style="display: none;"></div>
    </div>

    <script>
        let currentUser = null;

        // 登出功能
        document.getElementById('logout-btn').addEventListener('click', async () => {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (error) {
                console.error('登出失败:', error);
            }
        });

        // 显示消息提示
        function showMessage(message, type = 'success') {
            const toast = document.getElementById('message-toast');
            toast.textContent = message;
            toast.className = `message-toast ${type}`;
            toast.style.display = 'block';

            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // 加载用户信息
        async function loadUserProfile() {
            try {
                const response = await fetch('/api/user/profile');
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;

                    // 更新页面显示
                    document.getElementById('user-name').textContent =
                        currentUser.username || currentUser.email.split('@')[0];
                    document.getElementById('email').value = currentUser.email;
                    document.getElementById('username').value = currentUser.username || '';
                    document.getElementById('created-at').textContent = currentUser.created_at;

                    const verifiedStatus = document.getElementById('verified-status');
                    if (currentUser.is_verified) {
                        verifiedStatus.innerHTML = '<span class="status-success">✓ 已验证</span>';
                    } else {
                        verifiedStatus.innerHTML = '<span class="status-warning">⚠ 未验证</span> <small>请检查邮箱中的验证链接</small>';
                    }
                } else {
                    const data = await response.json();
                    showMessage(data.error || '加载用户信息失败', 'error');
                }
            } catch (error) {
                console.error('加载用户信息错误:', error);
                showMessage('网络错误，请重试', 'error');
            }
        }

        // 更新用户信息
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();

            if (!username) {
                showMessage('请输入用户名', 'error');
                return;
            }

            if (username.length > 50) {
                showMessage('用户名不能超过50个字符', 'error');
                return;
            }

            try {
                const response = await fetch('/api/user/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('✓ 保存成功');
                    // 更新当前用户信息
                    if (currentUser) {
                        currentUser.username = username;
                        document.getElementById('user-name').textContent = username;
                    }
                } else {
                    showMessage(data.error || '保存失败', 'error');
                }
            } catch (error) {
                console.error('更新用户信息错误:', error);
                showMessage('网络错误，请重试', 'error');
            }
        });

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', () => {
            loadUserProfile();
        });

        // 检查 URL 参数中的错误消息
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            showMessage(urlParams.get('error') || '操作失败', 'error');
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
</body>
</html>
