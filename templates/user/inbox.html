<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收件箱 - 雨天信箱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans+Pinstripe&family=Albert+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📮</text></svg>">
</head>
<body class="sunny-mode">
    <div id="weather-background"></div>

    <!-- 用户信息栏 -->
    <div class="user-bar" id="user-bar">
        <div class="user-info">
            <span class="user-greeting">你好，<span id="user-name">用户</span></span>
        </div>
        <div class="user-actions">
            <a href="/" class="user-link">首页</a>
            <a href="/user/settings" class="user-link">设置</a>
            <button id="logout-btn" class="text-btn">登出</button>
        </div>
    </div>

    <div class="container glass-effect fade-in">
        <header>
            <div class="brand-lockup">
                <span class="ks-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none">
                        <rect x="3" y="3" width="26" height="26" fill="currentColor"/>
                        <path d="M5 5 L27 27" stroke="oklch(7% 0.006 95)" stroke-width="2.5"/>
                    </svg>
                </span>
                <span class="ks-wordmark">RainMail</span>
            </div>
            <h1>我的收件箱</h1>
            <p>收到的远方来信</p>
        </header>

        <div class="inbox-container">
            <div id="letters-list" class="letters-list">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        // 登出功能
        document.getElementById('logout-btn').addEventListener('click', async () => {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (error) {
                console.error('登出失败:', error);
            }
        });

        // 加载用户信息
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/user/profile');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('user-name').textContent =
                        data.user.username || data.user.email.split('@')[0];
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
            }
        }

        // 加载收件箱
        async function loadInbox() {
            const container = document.getElementById('letters-list');

            try {
                const response = await fetch('/api/user/inbox');
                const data = await response.json();

                if (response.ok) {
                    if (data.letters && data.letters.length > 0) {
                        container.innerHTML = data.letters.map(letter => `
                            <div class="letter-item ${letter.is_read ? '' : 'unread'}">
                                <div class="letter-header">
                                    <span class="letter-location">📍 来自 ${letter.sender_location || '未知地点'}</span>
                                    <span class="letter-status">
                                        ${letter.is_unlocked ?
                                            (letter.is_read ? '📖 已读' : '🔓 已解锁') :
                                            '🔒 待解锁'}
                                    </span>
                                </div>
                                <div class="letter-time">${letter.created_at}</div>
                                ${letter.unlocked_at ? `<div class="letter-unlock-time">解锁时间: ${letter.unlocked_at}</div>` : ''}
                                <div class="letter-actions">
                                    ${letter.is_unlocked ?
                                        `<a href="/letters/${letter.id}" class="primary-btn">查看信件</a>` :
                                        `<span class="wait-text">等待雨天解锁...</span>`}
                                </div>
                            </div>
                        `).join('');
                    } else {
                        container.innerHTML = `
                            <div class="empty-state">
                                <p>📭 收件箱是空的</p>
                                <p>还没有收到远方来信</p>
                                <a href="/" class="primary-btn">返回首页</a>
                            </div>
                        `;
                    }
                } else {
                    container.innerHTML = `<div class="error">${data.error || '加载失败'}</div>`;
                }
            } catch (error) {
                console.error('加载收件箱错误:', error);
                container.innerHTML = '<div class="error">网络错误，请重试</div>';
            }
        }

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', () => {
            loadUserInfo();
            loadInbox();
        });
    </script>
</body>
</html>
