<!DOCTYPE html>
<html lang="zh-CN">
<!--
================================================================================
警告：非法侵入计算机信息系统将受到法律制裁
根据《中华人民共和国刑法》第二百八十五条、第二百八十六条
任何未经授权访问本系统的行为都将被记录并依法追究
================================================================================
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 雨天信箱</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
    <style>
        .admin-login {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
        }
        .admin-login h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="sunny-mode">
    <div class="container glass-effect admin-login">
        <h2>🔐 管理员登录</h2>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        {% if warning %}
            <div class="alert" style="background-color: #fff3cd; border: 1px solid #ffc107; color: #856404; padding: 15px; border-radius: 5px; margin-bottom: 20px; white-space: pre-wrap; font-size: 12px;">{{ warning }}</div>
        {% endif %}
        {% for entry in get_flashed_messages(with_categories=true) %}
          <div class="alert alert-{{ entry[0] }}">{{ entry[1] }}</div>
        {% endfor %}

        <form id="admin-login-form" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>

            <!-- 蜜罐字段 - 对浏览器隐藏，脚本会填充 -->
            <div style="position: absolute; left: -10000px; top: -10000px;">
                <label for="website_confirm">username</label>
                <input type="text" id="website_confirm" name="website_confirm" tabindex="-1" autocomplete="off">
            </div>

            <div class="error-message" id="error-message" style="display: none;"></div>

            <button type="submit" class="primary-btn" style="width: 100%">登录</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/" style="color: #666;">返回首页</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/gsap/gsap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/motion.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
