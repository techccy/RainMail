<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 雨天信箱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans+Pinstripe&family=Albert+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📮</text></svg>">
    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body class="auth-page">
    <div id="weather-background"></div>

    <div class="container glass-effect fade-in auth-container">
        <header>
            <div class="brand-lockup">
                <span class="ks-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none">
                        <rect x="3" y="3" width="26" height="26" fill="currentColor"/>
                        <path d="M5 5 L27 27" stroke="oklch(7% 0.006 95)" stroke-width="2.5"/>
                    </svg>
                </span>
                <span class="ks-wordmark">RainMail</span>
            </div>
            <h1>注册</h1>
            <p>创建你的账户</p>
        </header>

        <div class="info-notice">
            <span>请务必在注册后 <strong>1小时内</strong> 完成邮箱验证，否则账户将被自动删除。</span>
        </div>

        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" required placeholder="请输入邮箱" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="username">用户名（可选）</label>
                <input type="text" id="username" name="username" placeholder="留空则使用邮箱前缀">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="至少6位" autocomplete="new-password">
                <div class="password-strength" id="password-strength"></div>
            </div>

            <div class="form-group">
                <label for="confirm-password">确认密码</label>
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="再次输入密码" autocomplete="new-password">
            </div>

            <div class="error-message" id="error-message" style="display: none;"></div>
            <div class="success-message" id="success-message" style="display: none;"></div>

            <button type="submit" class="primary-btn">注册</button>
        </form>

        <div class="auth-links">
            <p>已有账户？ <a href="{{ url_for('login_page') }}">立即登录</a></p>
            <p><a href="{{ url_for('index') }}">返回首页</a></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/gsap/gsap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/motion.js') }}"></script>
    <script src="{{ url_for('static', filename='js/weather-bg.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
