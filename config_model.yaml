# ============================================================================
# 已弃用：此文件已不再使用，请使用 config_model.json
# ============================================================================
# 配置系统已统一使用 JSON 格式。
# 请使用 config_model.json 作为配置模板。
# ============================================================================

HEFENG_HOST1: "a"  # 替换为你的和风天气API主机地址1
# HEFENG_HOST2: "b"  # 替换为你的和风天气API主机地址2（如果有的话，取消注释）
HEFENG_KEY1: "APIKEY1" # 替换为你的和风天气API密钥1
# HEFENG_KEY2: "APIKEY2" # 替换为你的和风天气API密钥2（如果有的话，取消注释）
times: 60 # 请求频率，单位为秒
TURNSTILE_SECRET_KEY: "0x"  # 替换为你的 Cloudflare Turnstile Secret Key
TURNSTILE_SITE_KEY: "0x" # 替换成你自己的 Site Key
CAPTCHA_PROVIDER: "cloudflare"  # 验证方式选择: cloudflare, recaptcha_v3, cha, altcha
# Google reCAPTCHA v3 配置（当 CAPTCHA_PROVIDER 设为 recaptcha_v3 时使用）
# 在 https://www.google.com/recaptcha/admin 创建 v3 凭据
RECAPTCHA_V3_SITE_KEY: ""  # Google reCAPTCHA v3 Site Key
RECAPTCHA_V3_SECRET_KEY: ""  # Google reCAPTCHA v3 Secret Key
RECAPTCHA_V3_THRESHOLD: 0.5  # 分数阈值（0-1），Google推荐默认0.5，值越严格越可能拒绝真实用户
ALTCHA_HMAC_KEY: "your-hmac-key-here"  # Altcha HMAC 密钥
ALTCHA_DIFFICULTY: 1  # Altcha 难度
LOCATION_NAME: "广州"  # 服务器所在地
LOCATION_ID: 101280101  # 和风天气位置ID
admin_username: techccy # 管理员登录账号
admin_password: "" # 管理员登录密码
force_rain_duration: 10   # 强制降雨持续时间（分钟）
totp_decrypt_password: "password" # TOTP 密钥加密密码

# 邮件配置（新增：情感投递系统）
MAIL_SERVER: "smtp.gmail.com"  # SMTP 服务器地址
MAIL_PORT: 587  # SMTP 端口
MAIL_USE_TLS: true  # 是否使用 TLS
MAIL_USERNAME: "your-email@gmail.com"  # SMTP 用户名
MAIL_PASSWORD: "your-app-password"  # SMTP 密码
MAIL_DEFAULT_SENDER: "RainMail <noreply@rainmail.dev>"  # 默认发件人

# AI 内容审查配置
AI_MODERATION:
  API_KEY: "YOUR_API_KEY"
  BASE_URL: "YOUR_BASE_URL"
  MODEL: "MODEL"
  SYSTEM_PROMPT: >
    你是一个内容审查助手。请分析用户提交的内容是否包含暴力、色情、政治敏感或人身攻击。
    如果内容违规，请只返回 "True"；
    如果内容安全，请只返回 "False"。
    不要返回任何其他文字。

# 微信配置（预留：暂未实现）
WECHAT_ENABLED: false  # 是否启用微信公众号功能
WECHAT_APP_ID: ""  # 微信公众号 AppID
WECHAT_APP_SECRET: ""  # 微信公众号 AppSecret
WECHAT_TOKEN: ""  # 微信服务器验证令牌
WECHAT_ENCODING_AES_KEY: ""  # 消息加解密密钥（43字符）
WECHAT_TEMPLATE_ID: ""  # 回复通知模板消息ID
