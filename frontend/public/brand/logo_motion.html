<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#fff;display:grid;place-items:center;min-height:100vh}
.rm-stage{width:420px}
.rm-logo{display:block}
.rm-cloud{opacity:0;transform:scale(.94);transform-box:fill-box;transform-origin:50% 60%;animation:rm-cloud-in 1000ms cubic-bezier(0,0,0.2,1) 80ms forwards}
@keyframes rm-cloud-in{0%{opacity:0;transform:scale(.94)}18%{opacity:.5;transform:scale(.92)}60%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
.rm-drop{opacity:0;transform:translateY(-10px);transform-box:fill-box;transform-origin:center;animation:rm-drop-in 640ms cubic-bezier(0,0,0.2,1) forwards}
.rm-drop-1{animation-delay:520ms}.rm-drop-2{animation-delay:600ms}.rm-drop-3{animation-delay:680ms}.rm-drop-4{animation-delay:760ms}
@keyframes rm-drop-in{0%{opacity:0;transform:translateY(-10px)}55%{opacity:1}100%{opacity:1;transform:translateY(0)}}
.rm-wipe-rect{transform:scaleX(0);transform-origin:left center;transform-box:fill-box;animation:rm-wipe 720ms cubic-bezier(0,0,0.2,1) 640ms forwards}
@keyframes rm-wipe{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.rm-wordmark{opacity:0;transform:translateX(2px);transform-box:fill-box;transform-origin:center;animation:rm-wordmark-drift 720ms cubic-bezier(0,0,0.2,1) 640ms forwards}
@keyframes rm-wordmark-drift{0%{opacity:0;transform:translateX(2px)}30%{opacity:1}100%{opacity:1;transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.rm-cloud,.rm-drop,.rm-wordmark{opacity:1!important;transform:none!important;animation:none!important}.rm-wipe-rect{transform:scaleX(1)!important;animation:none!important}}
</style></head>

<script>
// QA hooks: ?t=<ms> pauses animations at timestamp; ?static=1 jumps to final
window.__p2mReady=false;
const DURATION=1400;
const params=new URLSearchParams(location.search);
function setup(){
  const t=params.get('t');const st=params.get('static');
  if(t!==null||st!==null){
    // pause all animations at a computed time
    const ts=st!==null?DURATION:Math.max(0,Math.min(DURATION,parseFloat(t)||0));
    document.getAnimations().forEach(a=>{a.pause();a.currentTime=ts;});
    // also ensure reduced/static final look for static
    document.querySelectorAll('.rm-cloud,.rm-drop,.rm-wordmark,.rm-wipe-rect').forEach(()=>{});
  }
  window.__p2mReady=true;
}
if(document.readyState!=='loading')setup();else document.addEventListener('DOMContentLoaded',setup);
</script>
